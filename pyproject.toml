[build-system]
requires = ["setuptools>=66.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ztf-reader"
version = "0.1.0"
description = "Submit, track, download, and read ZTF forced-photometry light curves."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
submit_ztf = "src.submit_ztf:main"
checking_ztf = "src.checking_ztf:main"
download_file = "src.download_file:main"
read_ztf = "src.read_ztf:main"
ztf_flux_reader = "src.ztf_flux_reader:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["config"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
