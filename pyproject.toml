[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ztf-reader"
version = "0.1.0"
description = "Submit, track, download, and read ZTF forced-photometry light curves."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy",
    "beautifulsoup4",
    "pandas",
    "python-dotenv",
    "requests",
]

[project.scripts]
submit_ztf = "src.submit_ztf:main"
checking_ztf = "src.checking_ztf:main"
download_file = "src.download_file:main"
read_ztf = "src.read_ztf:main"

[tool.setuptools]
packages = ["src"]
py-modules = ["config"]
